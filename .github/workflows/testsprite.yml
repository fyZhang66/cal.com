# Verifies the TES-4097 suggestion: split the suite into groups with `ci run --filter`,
# one matrix job per group, so "Re-run failed jobs" reruns only the failing group.
name: TestSprite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        group: [event, booking, availability]
    name: gate (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      TESTSPRITE_API_URL: "https://api.testsprite.com:11443"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm i -g @testsprite/testsprite-cli@0.15.0

      - name: Run the "${{ matrix.group }}" group
        run: >-
          testsprite ci run
          --project "13295f0b-4c78-44f1-85ba-b0efac91b79d"
          --env "default"
          --target-url "https://cal-com-green-six.vercel.app"
          --filter "${{ matrix.group }}"
          --summary-file testsprite-summary-${{ matrix.group }}.json

      - name: Upload TestSprite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-results-${{ matrix.group }}
          path: testsprite-summary-${{ matrix.group }}.json
          if-no-files-found: ignore
