# Generated by `testsprite ci init github`, then adapted: this project is FRONTEND and the
# account is on the V2 execution path, where `test run --all` dispatches backend tests only
# (all 5 FE tests came back in `skippedFrontend` and the action failed the job). Until the
# account is on V3 (or a test list is available), run each FE test through the action's
# single-test mode instead, one matrix job per test.
# Note: tests run against the project's CONFIGURED environment (https://cal.com), not this
# PR's code — a green check means the tests passed, not that the diff is safe.
name: TestSprite

on:
  push:
    branches: ["main"]
  pull_request:

# The job only needs to read the checkout metadata.
permissions:
  contents: read

jobs:
  testsprite:
    runs-on: ubuntu-latest
    # Fork PRs run without repository secrets, so the API key would be empty and
    # this check permanently red. Skip forks (a maintainer's push still runs it).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: homepage
            test-id: c8ec49c7-a3a6-4558-97d6-07284af00efc
          - name: pricing
            test-id: c16cef5b-7dd9-41db-a391-fba4c434480d
          - name: login
            test-id: 52925b80-2807-420c-985f-5a82da6e863e
          - name: signup
            test-id: d27bf376-7b2e-43c4-bc9c-ec351c63fa7e
          - name: blog
            test-id: c20d6118-d76b-4620-b8a0-08b0f551293f
    name: testsprite (${{ matrix.name }})
    steps:
      - uses: TestSprite/testsprite-action@v1
        with:
          api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          project: "0098a74b-b976-401d-b800-239f8292eca2"
          test-id: ${{ matrix.test-id }}
          cli-version: "0.10.0"
          timeout: "600"
